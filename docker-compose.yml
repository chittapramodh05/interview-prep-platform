version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mockmaster-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_prep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mockmaster-backend
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/interview_prep?schema=public
      - JWT_SECRET=supersecretjwtkey_12345
      - JWT_REFRESH_SECRET=supersecretrefreshjwtkey_67890
      - CLIENT_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mockmaster-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
    depends_on:
      - backend

volumes:
  pgdata:
